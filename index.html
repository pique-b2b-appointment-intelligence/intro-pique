<!DOCTYPE html>

<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{

  line-height:1.12;

  font-size:.95rem;
  line-height:1.75;
  color:#888880;
  max-width:360px;
  margin:0 auto;
}
.divider{
  width:32px;
  height:1px;
  background:#D4D2CC;
  margin:36px auto;
}
.contact{
  font-size:.8rem;
  color:#AEADA6;

.contact a{
