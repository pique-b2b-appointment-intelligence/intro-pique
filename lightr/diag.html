<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>diag</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&family=Caveat:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="icon" href="favicon.svg">
<link rel="stylesheet" href="thema-lightr.css">
<link rel="stylesheet" href="lp.css">
<style>
  /* debugbox altijd zichtbaar, ook als de intro de body verbergt */
  #dbg{position:fixed;top:8px;left:8px;z-index:2147483647;background:#fff;color:#000;
    font:13px/1.5 monospace;padding:10px 12px;border:2px solid red;border-radius:8px;
    max-width:94vw;white-space:pre;visibility:visible!important}
  html.pq-on #dbg{visibility:visible!important}
  /* TEST: forceer de verberging van niet-onthulde letters */
  #pq .pq-ch{opacity:0!important;transform:translateY(2px)!important}
  #pq .pq-ch.on{opacity:1!important;transform:none!important}
</style>
<script>
  window.PQ_VIDEO    = 'placeholder-video.mp4';
  window.PIQUE_INTRO = { voornaam:'Sven', bedrijf:'Aanpoters', merk:false, tempo:60, pauze:600 };
</script>
<script src="lp-intro.js"></script>
</head>
<body>
<div id="dbg">laden...</div>

<header class="hero" id="top">
  <div class="hero-inner">
    <div class="hero-left">
      <div class="slot" id="slot">
        <div class="slot-card" id="slotcard">
          <div class="h">Hoi Sven.<br>Ik keek een tijd naar <em>Aanpoters</em>.</div>
          <div class="sig">Simon</div>
        </div>
        <span class="slot-tag">De kaart op je bureau</span>
      </div>
    </div>
    <div class="hero-right"><h1 class="hero-h1">Diagnose</h1></div>
  </div>
</header>

<script>
  function rep(){
    var pq  = document.getElementById('pq');
    var chs = document.querySelectorAll('.pq-ch');
    var on  = document.querySelectorAll('.pq-ch.on').length;
    var zichtbaar = 0, opLast = 'n/a';
    for (var k=0;k<chs.length;k++){ if (parseFloat(getComputedStyle(chs[k]).opacity) > 0.5) zichtbaar++; }
    if (chs.length) opLast = getComputedStyle(chs[chs.length-1]).opacity;
    var rm  = matchMedia('(prefers-reduced-motion:reduce)').matches;
    document.getElementById('dbg').textContent =
      'overlay(#pq): ' + (pq ? 'JA' : 'nee') +
      '\nletters totaal: ' + chs.length +
      '\nletters met class .on: ' + on +
      '\nletters ECHT zichtbaar: ' + zichtbaar +
      '\nopacity LAATSTE letter: ' + opLast +
      '\nverklein-beweging aan: ' + rm +
      '\ntijd: ' + Math.round(performance.now()) + 'ms';
  }
  setInterval(rep, 120);
  rep();
</script>
</body>
</html>
